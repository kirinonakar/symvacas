[package]
name = "symvacas-windows"
version = "1.6.6"
description = "SymvaCAS Windows desktop, CLI and MCP server"
edition = "2021"
default-run = "symvacas"
license = "MIT"

[lib]
name = "symvacas_windows"
path = "src/lib.rs"

[[bin]]
name = "symvacas"
path = "src/main.rs"

[[bin]]
name = "symvacas-cli"
path = "src/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate"] }
fs2 = "0.4"
boa_engine = "0.21"

[profile.release]
lto = "thin"
strip = true
